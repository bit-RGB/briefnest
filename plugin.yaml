# plugin.yaml
name: intelligence-feed
version: "0.1.1"
description: BriefNest — a profile-isolated news dashboard for Hermes Desktop with semiconductor, AI, automotive, music and Weibo channels
license: MIT
requires_env:
  - name: LASTFM_API_KEY
    description: Optional legacy Last.fm source credential; not needed by the default sources
    secret: true
python_dependencies:
  - "fastapi>=0.115,<1"
  - "pydantic>=2,<3"
